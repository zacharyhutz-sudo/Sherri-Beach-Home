[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirects for cleaner function URLs
[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/save-bookings"
  status = 200

[[redirects]]
  from = "/api/bookings/*"
  to = "/.netlify/functions/save-bookings"
  status = 200
